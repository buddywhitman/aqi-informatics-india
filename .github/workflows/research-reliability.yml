name: Run exploratory reliability research
on:
  push:
    branches: [research/task-relative-reliability]
    paths:
      - 'research/**'
      - '.github/workflows/research-reliability.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/task-relative-reliability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn
      - name: Run newest robustness studies
        env:
          GEOM_DISAGREE_REPS: '150'
        run: |
          python research/geometry_disagreement_diagnostic.py
          python research/task_weighted_calibration.py
      - name: Commit reproducible outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/geometry_disagreement_*.csv research/results/task_weighted_calibration_*.csv
          if ! git diff --cached --quiet; then
            git commit -m "research: execute robust geometry and task-weighted calibration [skip ci]"
            git push origin HEAD:research/task-relative-reliability
          fi
