name: Run exploratory reliability research
on:
  push:
    branches: [research/task-relative-reliability]
    paths:
      - 'research/**'
      - '.github/workflows/research-reliability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/task-relative-reliability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn
      - name: Run newest robustness studies
        env:
          GEOM_DISAGREE_REPS: '150'
        run: |
          python research/geometry_disagreement_diagnostic.py
          python research/task_weighted_calibration.py
          python research/adversarial_calibration_concentration.py
          python research/multitask_calibration_gap.py
          python research/task_conditioned_representation_dominance.py
          python research/minimax_task_family.py
          python research/representation_selection_regret.py
          python research/representation_metric_impossibility.py
          python research/directional_calibration_spectrum.py
          python research/directional_reliability_operator.py
          python research/operator_bound_tightness.py
          python research/contrast_specific_bound.py
          python research/subspace_reliability.py
          python research/target_subspace_resolution_paradox.py
          python research/target_aware_model_selection.py
          python research/target_aware_regularization.py
          python research/target_drift_robustness.py
          python research/robust_target_family_regularization.py
          python research/pretest_target_selection_bias.py
          python research/reliability_budget_decomposition.py
          python research/representation_accuracy_rate_requirement.py
          python research/crossfit_representation_rate.py
          python research/orthogonality_to_representation.py
          python research/representation_orthogonal_toy.py
          python research/orthogonal_latent_moment.py
          python research/partial_orthogonality.py
          python research/orthogonality_priority.py
          python research/integrated_operator_stress_test.py
          python research/operator_nonlinearity_breakdown.py
      - name: Summarize outputs
        run: |
          cat research/results/geometry_disagreement_summary.csv
          cat research/results/task_weighted_calibration_summary.csv
          cat research/results/adversarial_calibration_concentration_summary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: research-results
          path: |
            research/results/geometry_disagreement_*.csv
            research/results/task_weighted_calibration_*.csv
            research/results/adversarial_calibration_concentration_*.csv
            research/results/multitask_calibration_gap_*.csv
            research/results/task_conditioned_representation_*.csv
            research/results/minimax_task_family_*.csv
            research/results/representation_selection_regret*.csv
            research/results/representation_metric_impossibility*.csv
            research/results/directional_calibration_spectrum*.csv
            research/results/directional_reliability_operator*.csv
            research/results/operator_bound_tightness*.csv
            research/results/contrast_specific_bound*.csv
            research/results/subspace_reliability*.csv
            research/results/target_subspace_resolution_paradox*.csv
            research/results/target_aware_model_selection*.csv
            research/results/target_aware_regularization*.csv
            research/results/target_drift_robustness*.csv
            research/results/robust_target_family_regularization*.csv
            research/results/pretest_target_selection_bias*.csv
            research/results/reliability_budget_decomposition*.csv
            research/results/representation_accuracy_rate_requirement*.csv
            research/results/crossfit_representation_rate*.csv
            research/results/orthogonality_to_representation*.csv
            research/results/representation_orthogonal_toy*.csv
            research/results/orthogonal_latent_moment*.csv
            research/results/partial_orthogonality*.csv
            research/results/orthogonality_priority*.csv
            research/results/integrated_operator_stress_test*.csv
            research/results/operator_nonlinearity_breakdown*.csv
