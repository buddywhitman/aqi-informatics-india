name: Final AISTATS submission verification
on:
  push:
    branches: [submission/aistats2027-final-synthesis]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn
      - name: Scientific verification
        run: python verify_science.py
      - name: Final synthesis consistency
        run: python verify_submission_synthesis.py
      - name: Compile AISTATS manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
      - name: Copy compiled PDF and verify artifacts
        run: |
          test -s paper/main.pdf
          python src/build_supplementary_archive.py
          python verify_artifacts.py
          pdfinfo paper/main.pdf | tee paper/pdfinfo.txt
          pages=$(pdfinfo paper/main.pdf | awk '/^Pages:/ {print $2}')
          echo "Compiled pages: $pages"
          test "$pages" -ge 10
          pdftotext -f 8 -l 8 paper/main.pdf paper/page8.txt
          pdftotext -f 9 -l 9 paper/main.pdf paper/page9.txt
          if grep -q "AI Use Statement" paper/page8.txt; then
            echo "AI Use Statement leaked into page 8: main-text page-budget violation"
            exit 1
          fi
          grep -q "AI Use Statement" paper/page9.txt
          echo "Main text ends by page 8; AI Use Statement begins on page 9."
      - name: Compliance text checks
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path("paper/main.tex").read_text()
          assert t.index("\\subsection*{AI Use Statement}") < t.index("\\begin{thebibliography}")
          assert "Anonymous Author(s)" in t and "Anonymous Institution(s)" in t
          forbidden=["buddywhitman","aqi-informatics-india/commit","github.com/buddywhitman"]
          for x in forbidden:
              assert x not in t, x
          print("AI statement ordering and manuscript anonymity checks passed")
          PY
          if zipgrep -Eiq 'buddywhitman|github\.com/buddywhitman|aqi-informatics-india' AISTATS2027_OR_DML_Supplementary_Material.zip; then
            echo "Identifying repository material found in supplementary archive"
            exit 1
          fi
          echo "Supplement anonymity scan passed"
      - name: Commit compiled submission artifacts
        run: |
          git fetch origin submission/aistats2027-final-synthesis
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/submission/aistats2027-final-synthesis)" ]; then
            echo "Branch advanced during verification; refusing to push stale compiled artifacts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.pdf AISTATS2027_OR_DML_Supplementary_Material.zip
          if ! git diff --cached --quiet; then
            git commit -m "submission: compile verified AISTATS PDF and supplementary archive [skip ci]"
            git pull --rebase origin submission/aistats2027-final-synthesis
            git push origin HEAD:submission/aistats2027-final-synthesis
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aistats2027-final-submission
          path: |
            paper/main.pdf
            paper/main.tex
            paper/aistats2027.sty
            paper/pdfinfo.txt
            AISTATS2027_OR_DML_Supplementary_Material.zip
            SUPPLEMENT_ROADMAP.md
            research/FINAL_AUDIT_CHECKLIST.md
            research/FINAL_CANDIDATE_SYNTHESIS.md
