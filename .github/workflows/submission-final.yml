name: Final AISTATS submission verification
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: aistats-final-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn pypdf
      - name: Scientific verification
        run: python verify_science.py
      - name: Final synthesis consistency
        run: python verify_submission_synthesis.py
      - name: Compile AISTATS manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
      - name: Copy compiled PDF and verify artifacts
        run: |
          test -s paper/main.pdf
          python src/build_supplementary_archive.py
          sha256sum AISTATS2027_OR_DML_Supplementary_Material.zip > /tmp/supp.sha
          cp AISTATS2027_OR_DML_Supplementary_Material.zip /tmp/supp-first.zip
          python src/build_supplementary_archive.py
          cmp /tmp/supp-first.zip AISTATS2027_OR_DML_Supplementary_Material.zip
          sha256sum -c /tmp/supp.sha
          python verify_artifacts.py
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          r=PdfReader("paper/main.pdf")
          pages=len(r.pages)
          Path("paper/pdfinfo.txt").write_text(f"Pages: {pages}\n")
          assert pages >= 10
          texts=[p.extract_text() or "" for p in r.pages]
          ai_pages=[i+1 for i,x in enumerate(texts) if "AI Use Statement" in x]
          assert ai_pages, "AI Use Statement missing from compiled PDF"
          ai_page=ai_pages[0]
          assert ai_page == 9, f"AI Use Statement begins on page {ai_page}, so main text does not occupy exactly pages 1-8"
          assert "AI Use Statement" not in texts[7], "AI Use Statement leaked into page 8"
          print(f"Compiled pages: {pages}; main text ends by page 8; AI Use Statement begins on page {ai_page}.")
          PY
      - name: Compliance text checks
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path("paper/main.tex").read_text()
          assert t.index("\\subsection*{AI Use Statement}") < t.index("\\begin{thebibliography}")
          assert "Anonymous Author(s)" in t and "Anonymous Institution(s)" in t
          forbidden=["buddywhitman","aqi-informatics-india/commit","github.com/buddywhitman"]
          for x in forbidden:
              assert x not in t, x
          print("AI statement ordering and manuscript anonymity checks passed")
          PY
          if zipgrep -Eiq 'buddywhitman|github\.com/buddywhitman|aqi-informatics-india' AISTATS2027_OR_DML_Supplementary_Material.zip; then
            echo "Identifying repository material found in supplementary archive"
            exit 1
          fi
          echo "Supplement anonymity scan passed"
      - name: Commit compiled submission artifacts
        run: |
          git fetch origin master
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            echo "Branch advanced during verification; refusing to push stale compiled artifacts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.pdf
          git add -f AISTATS2027_OR_DML_Supplementary_Material.zip
          if ! git diff --cached --quiet; then
            git commit -m "submission: compile verified AISTATS PDF and supplementary archive [skip ci]"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aistats2027-final-submission
          path: |
            paper/main.pdf
            paper/main.tex
            paper/aistats2027.sty
            paper/pdfinfo.txt
            AISTATS2027_OR_DML_Supplementary_Material.zip
            SUPPLEMENT_ROADMAP.md
            research/FINAL_AUDIT_CHECKLIST.md
            research/FINAL_CANDIDATE_SYNTHESIS.md
