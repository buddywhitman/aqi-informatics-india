name: AISTATS submission gate
# Final audited gate: supplement is built before artifact synchronization checks.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python verify_science.py
      - run: python verify_submission_synthesis.py
      - name: Compile manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
      - run: python src/build_supplementary_archive.py
      - run: python verify_artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: aistats2027-submission
          path: |
            paper/main.pdf
            AISTATS2027_OR_DML_Supplementary_Material.zip
